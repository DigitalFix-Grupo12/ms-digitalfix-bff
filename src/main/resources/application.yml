server:
  port: 8080

spring:
  application:
    name: ms-digitalfix-bff

# Tenants de Microsoft Entra ID en los que confia el BFF (uno por integrante).
# Cada uno aporta: Directory (tenant) ID y Application (client) ID de su
# registro "digitalfix-api". El issuer esperado es
# https://login.microsoftonline.com/<tenant-id>/v2.0 y el claim "aud" de los
# access tokens v2.0 es el GUID puro de la API (NO "api://<guid>").
# El segundo tenant es opcional: si sus variables estan vacias se ignora.
digitalfix:
  security:
    tenants:
      - tenant-id: ${AZURE_TENANT_ID:}
        audience: ${AZURE_API_CLIENT_ID:}
      - tenant-id: ${AZURE_TENANT_ID_2:}
        audience: ${AZURE_API_CLIENT_ID_2:}
    # CORS: en dev el frontend corre en :4200
    allowed-origins: http://localhost:4200
  # URLs de los microservicios de dominio. Todos corren en el mismo host
  # (localhost) -- el BFF es el unico expuesto hacia afuera (via API Gateway).
  services:
    workorders-url: http://localhost:8082
    catalog-url: http://localhost:8083
    report-url: http://localhost:8084
    audit-url: http://localhost:8085
    rabbit-admin-url: http://localhost:8087

logging:
  level:
    org.springframework.security: INFO
